name: Deploy Documentation

on:
  push:
    branches: [ main ]

  # Allow the workflow to be triggered manually from GitHub Actions
  workflow_dispatch:

# Permissions required for deploying to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_REGISTRY_API_BASE_URL: ${{ vars.NEXT_PUBLIC_REGISTRY_API_BASE_URL }}
          NEXT_PUBLIC_ALGOLIA_APP_ID: ${{ vars.NEXT_PUBLIC_ALGOLIA_APP_ID }}
          NEXT_PUBLIC_ALGOLIA_SEARCH_KEY: ${{ vars.NEXT_PUBLIC_ALGOLIA_SEARCH_KEY }}
          ALGOLIA_WRITE_KEY: ${{ secrets.ALGOLIA_WRITE_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SITE_URL" ] || \
             [ -z "$NEXT_PUBLIC_REGISTRY_API_BASE_URL" ] || \
             [ -z "$NEXT_PUBLIC_ALGOLIA_APP_ID" ] || \
             [ -z "$NEXT_PUBLIC_ALGOLIA_SEARCH_KEY" ] || \
             [ -z "$ALGOLIA_WRITE_KEY" ]; then
            echo "::error::Set NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_REGISTRY_API_BASE_URL, NEXT_PUBLIC_ALGOLIA_APP_ID, and NEXT_PUBLIC_ALGOLIA_SEARCH_KEY as Actions variables, and ALGOLIA_WRITE_KEY as an Actions secret."
            exit 1
          fi
          pnpm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
